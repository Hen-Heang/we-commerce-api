spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/we_commerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50000KB

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
    expiration: ${JWT_EXPIRATION:3153600000000}
    refresh-token:
      expiration: ${JWT_REFRESH_EXPIRATION:31536000000000}
